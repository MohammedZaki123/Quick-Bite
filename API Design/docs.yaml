                  - id: 6
                    resource: "members"
                    action: "delete"
                    description: "Remove staff members"
                  - id: 7
                    resource: "menu"
                    action: "read"
                    description: "View menu items"
                  - id: 8
                    resource: "menu"
                    action: "create"
                    description: "Create menu items"
                  - id: 9
                    resource: "menu"
                    action: "update"
                    description: "Update menu items"
                  - id: 10
                    resource: "menu"
                    action: "delete"
                    description: "Delete menu items"
                  - id: 11
