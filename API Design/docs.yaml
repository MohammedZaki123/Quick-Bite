            schema:
              type: object
              required:
                - verification_code
              properties:
                verification_code:
                  type: string
                  pattern: '^\d{4,6}$'
                pickup_timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Order picked up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'

  /agents/me/deliveries/{delivery_id}/deliver:
    parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: integer
    
    post:
      tags: [Delivery]
      summary: Mark order delivered to customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verification_code
              properties:
                verification_code:
                  type: string
                  pattern: '^\d{4,6}$'
                delivery_timestamp:
                  type: string
                  format: date-time
                photo_url:
                  type: string
                  format: uri
                  description: Proof of delivery photo
                signature:
                  type: string
                  description: Base64 encoded signature
                notes:
                  type: string
                  maxLength: 500
                cash_collected:
                  type: number
                  format: decimal
                  description: Required if payment method is COD
      responses:
        '200':
          description: Order delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery:
                    $ref: '#/components/schemas/Delivery'
                  earnings:
                    type: object
                    properties:
                      delivery_fee:
                        type: number
                        format: decimal
                      tip:
                        type: number
                        format: decimal
                      total:
                        type: number
                        format: decimal

  /agents/me/earnings:
    get:
      tags: [Delivery]
      summary: Get earnings summary
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Earnings summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_deliveries:
                    type: integer
                  total_earnings:
                    type: number
                    format: decimal
                  base_earnings:
                    type: number
                    format: decimal
                  tips:
                    type: number
                    format: decimal
                  bonuses:
                    type: number
                    format: decimal
                  daily_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        deliveries:
                          type: integer
                        earnings:
                          type: number
                          format: decimal

  # ============================================================================
  # PAYMENTS
  # ============================================================================
  
  /payments/methods:
    get:
      tags: [Payments]
      summary: List saved payment methods
      responses:
        '200':
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
    
    post:
      tags: [Payments]
      summary: Add payment method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_id
                - payment_method_token
              properties:
                provider_id:
                  type: integer
                payment_method_token:
                  type: string
                  description: Token from payment provider (e.g., Stripe)
      responses:
        '201':
          description: Payment method added

  /payments/methods/{payment_method_id}:
    parameters:
      - name: payment_method_id
        in: path
        required: true
        schema:
          type: integer
    
    delete:
      tags: [Payments]
      summary: Remove payment method
      responses:
        '204':
          description: Payment method removed

  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================
  
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unread, read, all]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /notifications/{notification_id}/read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
    
    post:
      tags: [Notifications]
      summary: Mark notification as read
      responses:
        '200':
          description: Marked as read

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_enabled:
                    type: boolean
                  sms_enabled:
                    type: boolean
                  push_enabled:
                    type: boolean
    
    patch:
      tags: [Notifications]
      summary: Update notification preferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_enabled:
                  type: boolean
                sms_enabled:
                  type: boolean
                push_enabled:
                  type: boolean
      responses:
        '200':
          description: Preferences updated

  # ============================================================================
  # ADMIN
  # ============================================================================
  
  /admin/restaurants:
    get:
      tags: [Admin]
      summary: List all restaurants
      description: Admin only
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, suspended]
        - name: region
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of restaurants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'

  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders
      description: Admin only
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: restaurant_id
          in: query
          schema:
            type: integer
        - name: customer_id
          in: query
          schema:
            type: integer
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'

  /admin/payments/{payment_id}/refund:
    parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: integer
    
    post:
      tags: [Admin]
      summary: Issue refund
      description: Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - reason
                - reason_code
              properties:
                amount:
                  type: number
                  format: decimal
                reason:
                  type: string
                  maxLength: 500
                reason_code:
                  type: string
                  enum: [order_cancelled, customer_request, quality_issue, other]
      responses:
        '200':
          description: Refund issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /admin/analytics/overview:
    get:
      tags: [Admin]
      summary: Get system analytics
      description: Admin only
      parameters:
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: region
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_orders:
                    type: integer
                  completed_orders:
                    type: integer
                  cancelled_orders:
                    type: integer
                  total_gmv:
                    type: number
                    format: decimal
                  platform_revenue:
                    type: number
                    format: decimal
                  average_order_value:
                    type: number
                    format: decimal

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: JWT Bearer token
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: integer
      description: Restaurant ID
      example: 100

    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
      description: Restaurant member ID
      example: 5

    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
      description: Role ID
      example: 2
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: "manager"
        description:
          type: string
          example: "Can manage menu and orders"
        is_system:
          type: boolean
          description: Whether this is a system-defined role
          example: true
        is_custom:
          type: boolean
          description: Whether this is a custom role created by restaurant
          example: false
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-02-10T14:20:00Z"
    Permission:
      type: object
      properties:
        id:
          type: integer
          example: 5
        resource:
          type: string
          description: Resource the permission applies to
          example: "menu"
        action:
          type: string
          description: Action allowed on the resource
          enum: [read, create, update, delete, "*"]
          example: "update"
        description:
          type: string
          example: "Update menu items"
    # ========================================================================
    # USER & AUTHENTICATION
    # ========================================================================
    
    User:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: "+12125551234"
        role:
          type: string
          enum: [customer, restaurant_member, delivery_agent, admin]
        status:
          type: string
          enum: [available, blocked]

    # ========================================================================
    # CUSTOMER
    # ========================================================================
    
    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            default_address:
              $ref: '#/components/schemas/Address'

    Address:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        label:
          type: string
          example: Home
        text:
          type: string
          example: 123 Main St, Apt 4B, New York, NY 10001
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    AddressInput:
      type: object
      required:
        - label
        - lat
        - lng
        - text
      properties:
        label:
          type: string
          maxLength: 50
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        text:
          type: string
          maxLength: 500
        is_default:
          type: boolean

    # ========================================================================
    # RESTAURANT
    # ========================================================================
    
    RestaurantSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        primary_country:
          type: string
        logo_url:
          type: string
          format: uri
        is_active:
          type: boolean
    Restaurant:
      allOf:
        - $ref: '#/components/schemas/RestaurantSummary'
        - type: object
          properties:
            description:
              type: string
            branches:
              type: array
              items:
                $ref: '#/components/schemas/Branch'
            created_at:
              type: string
              format: date-time

    Branch:
      type: object
      properties:
        id:
          type: integer
        restaurant_id:
          type: integer
        subcode:
          type: string
        label:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        country_code:
          type: string
        opens_at:
          type: string
        closes_at:
          type: string
        currency:
          type: string
        is_active:
          type: boolean

    RestaurantMember:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        restaurant_id:
          type: integer
        status:
          type: string
        role:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              example: manager
            permissions:
              type: array
              items:
                type: string

    # ========================================================================
    # MENU
    # ========================================================================
    
    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        display_order:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri
        price:
          type: number
          format: decimal
        is_available:
          type: boolean
        customizations:
          type: array
          items:
            $ref: '#/components/schemas/MenuCustomization'
        created_at:
          type: string
          format: date-time

    MenuCustomization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Size
        type:
          type: string
          enum: [single, multiple]
        is_required:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/CustomizationOption'

    CustomizationOption:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Large
        price_modifier:
          type: number
          format: decimal
          example: 2.00
        is_available:
          type: boolean

    MenuItemInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        category_id:
          type: integer
        price:
          type: number
          format: decimal
          minimum: 0
        image_url:
          type: string
          format: uri
        is_available:
          type: boolean

    # ========================================================================
    # CART
    # ========================================================================
    
    Cart:
      type: object
      properties:
        cart_id:
          type: string
        customer_id:
          type: integer
        restaurant_id:
          type: integer
        restaurant_name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: decimal
        delivery_fee:
          type: number
          format: decimal
        tax:
          type: number
          format: decimal
        total:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        unit_price:
          type: number
          format: decimal
        customizations:
          type: array
          items:
            type: object
            properties:
              customization_name:
                type: string
              selected_option_name:
                type: string
              price_modifier:
                type: number
                format: decimal
        subtotal:
          type: number
          format: decimal

    # ========================================================================
    # ORDER
    # ========================================================================
    
    OrderSummary:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        restaurant_id:
          type: integer
        restaurant_name:
          type: string
        country_code:
          type: string
        status:
          type: string
          enum: [pending, accepted, preparing, ready_for_pickup, picked_up, out_for_delivery, delivered, cancelled, rejected]
        subtotal:
          type: number
          format: decimal
        delivery_fee:
          type: number
          format: decimal
        service_fee:
          type: number
          format: decimal
        currency:
          type: string
        created_at:
          type: string
          format: date-time

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            branch_id:
              type: integer
            customer_address_id:
              type: integer
            delivery_address_text:
              type: string
            delivery_lat:
              type: number
              format: double
            delivery_long:
              type: number
              format: double
            delivery_agent_id:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            payment:
              $ref: '#/components/schemas/Payment'
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/OrderTimelineEvent'
            accepted_at:
              type: string
              format: date-time
            picked_up_at:
              type: string
              format: date-time
            assigned_at:
              type: string
              format: date-time
            delivered_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price_snapshot:
          type: number
          format: decimal
        name_snapshot:
          type: string
        image_url_snapshot:
          type: string
        customizations:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time

    OrderTimelineEvent:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        from_status:
          type: string
        to_status:
          type: string
        changed_by:
          type: integer
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    OrderTracking:
      type: object
      properties:
        order_id:
          type: integer
        status:
          type: string
        restaurant:
          type: object
          properties:
            name:
              type: string
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        delivery_address:
          type: object
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        agent:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            phone:
              type: string
            vehicle_type:
              type: string
            current_location:
              type: object
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                bearing:
                  type: integer
                updated_at:
                  type: string
                  format: date-time
        estimated_delivery_time:
          type: string
          format: date-time

    # ========================================================================
    # PAYMENT
    # ========================================================================
    
    Payment:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        method:
          type: string
          enum: [online, cod]
        provider_id:
          type: integer
        status:
          type: string
          enum: [pending, authorized, captured, failed, refunded]
        amount:
          type: number
          format: decimal
        currency:
          type: string
        provider_reference_id:
          type: string
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      properties:
        id:
          type: integer
        provider_id:
          type: integer
        provider_name:
          type: string
        type:
          type: string
          example: card
        last_four:
          type: string
          example: "4242"
        brand:
          type: string
          example: visa
        expiry_month:
          type: integer
        expiry_year:
          type: integer
        is_default:
          type: boolean

    Refund:
      type: object
      properties:
        id:
          type: integer
        payment_id:
          type: integer
        order_id:
          type: integer
        amount:
          type: number
          format: decimal
        reason:
          type: string
        reason_code:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    # ========================================================================
    # DELIVERY
    # ========================================================================
    
    DeliveryAgent:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        vehicle_type:
          type: string
          enum: [bike, scooter, car]
        status:
          type: string
          enum: [available, busy, offline]
        rating:
          type: number
          format: float
        total_deliveries:
          type: integer
        current_latitude:
          type: number
          format: double
        current_longitude:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    Delivery:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        agent_id:
          type: integer
        status:
          type: string
          enum: [assigned, accepted, picked_up, delivered, rejected]
        restaurant:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        customer:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
            address:
              type: string
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        payment_method:
          type: string
        tip_amount:
          type: number
          format: decimal
        delivery_fee:
          type: number
          format: decimal
        assigned_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        picked_up_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    # ========================================================================
    # PAYOUT
    # ========================================================================
    
    Payout:
      type: object
      properties:
        id:
          type: integer
        restaurant_id:
          type: integer
        amount:
          type: number
          format: decimal
        admin_user_id:
          type: integer
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    # ========================================================================
    # NOTIFICATION
    # ========================================================================
    
    Notification:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [email, sms, push]
        channel:
          type: string
        subject:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [pending, sent, failed, read]
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time

    # ========================================================================
    # COMMON
    # ========================================================================
    
    CursorPagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        total_count:
          type: integer
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              example:
                  message: Email or password is Invalid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Invalid request parameters
              details:
                email: Email is required

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Invalid email or password

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Insufficient permissions

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Resource not found
