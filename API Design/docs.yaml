openapi: 3.0.3
info:
  title: QuickBite API
  description: |
    RESTful API for QuickBite food delivery platform
    
    ## Features
    - Multi-region support
    - Strong consistency for payments
    - Real-time order tracking
    - Restaurant menu management with customizations
    - Delivery agent assignment and tracking
    - RBAC for restaurant staff
    
  version: 1.0.0
  contact:
    name: QuickBite API Support
    email: api-support@quickbite.com

servers:
  - url: https://api.quickbite.com/v1
    description: Production (US-EAST)
  - url: https://api-west.quickbite.com/v1
    description: Production (US-WEST)
  - url: https://api-eu.quickbite.com/v1
    description: Production (EU)
  - url: https://api-sandbox.quickbite.com/v1
    description: Sandbox

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Customers
    description: Customer profile and address management
  - name: Restaurants
    description: Restaurant operations and management
  - name: Menu
    description: Menu browsing and management
  - name: Cart
    description: Shopping cart operations
  - name: Orders
    description: Order placement and management
  - name: Payments
    description: Payment processing
  - name: Delivery
    description: Delivery agent operations
  - name: Notifications
    description: Notification management
  - name: Admin
    description: Administrative operations
  - name: Restaurant Staff
    description: Manage restaurant staff members and their roles
  - name: Branch Access
    description: Control which branches staff members can access
  - name: Roles & Permissions
    description: Manage custom roles and permissions


security:
  - BearerAuth: []

paths:
  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create a new user account (customer, restaurant owner, or delivery agent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - phone
                - name
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123!
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                  example: "+12125551234"
                name:
                  type: string
                  maxLength: 100
                  example: John Doe
                role:
                  type: string
                  enum: [customer, restaurant_staff, delivery_agent]
                  example: customer
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    example: john.doe@example.com
                  phone:
                    type: string
                    pattern: '^\+[1-9]\d{1,14}$'
                    example: "+12125551234"
                  name:
                    type: string
                    maxLength: 100
                    example: John Doe
                  role:
                    type: string
                    example: customer
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  status:
                    type: string
                    enum: ["available", "blocked"]
                    example: available
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      description: Authenticate user and obtain access tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      responses:
        '200':
          description: Logged out successfully

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Confirm password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description:  Reset email sent

  # ============================================================================
  # CUSTOMERS
  # ============================================================================
  
  /customers/me:
    get:
      tags: [Customers]
      summary: Get current customer profile
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    
    patch:
      tags: [Customers]
      summary: Update customer profile
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/me/addresses:
    get:
      tags: [Customers]
      summary: List customer addresses
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
    
    post:
      tags: [Customers]
      summary: Add new address
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /customers/me/addresses/{address_id}:
    parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/AuthorizationHeader'
    get:
      tags: [Customers]
      summary: Get address details
      responses:
        '200':
          description: Address details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
    
    patch:
      tags: [Customers]
      summary: Update address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
    
    delete:
      tags: [Customers]
      summary: Delete address
      responses:
        '204':
          description: Address deleted

  # ============================================================================
  # RESTAURANTS (Discovery & Browsing)
  # ============================================================================
  
  /restaurants:
    get:
      tags: [Restaurants]
      summary: Search and discover restaurants
      description: Find restaurants based on location, cuisine, rating, etc.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 40.7128
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: -74.0060
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of restaurants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestaurantSummary'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'

  /restaurants/{restaurant_id}:
    parameters:
      - name: restaurant_id
        in: path
        required: true
        schema:
          type: integer
    
    get:
      tags: [Restaurants]
      summary: Get restaurant details
      responses:
        '200':
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'

  # ============================================================================
  # MENU
  # ============================================================================
  
  /restaurants/{restaurant_id}/menu:
    parameters:
      - name: restaurant_id
        in: path
        required: true
        schema:
          type: integer
    
    get:
      tags: [Menu]
      summary: Get restaurant menu
      description: Retrieve complete menu with categories and items
      responses:
        '200':
          description: Restaurant menu
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant_id:
                    type: integer
                  restaurant_name:
                    type: string
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuCategory'

  /restaurants/{restaurant_id}/menu/items/{item_id}:
    parameters:
      - name: restaurant_id
        in: path
        required: true
        schema:
          type: integer
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
    
    get:
      tags: [Menu]
      summary: Get menu item details
      description: Get detailed information about a specific menu item including customizations
      responses:
        '200':
          description: Menu item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
  /restaurants/{restaurantId}/members:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/AuthorizationHeader'
    
    get:
      tags: [Restaurant Staff]
      summary: List restaurant staff members
      description: |
        Get all staff members for a restaurant.
        
        **Required role:** Owner or Admin
      responses:
        '200':
          description: List of staff members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestaurantMember'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
              example:
                data:
                  - id: 1
                    user_id: 12345
                    restaurant_id: 100
                    user:
                      name: "John Smith"
                      email: "john@example.com"
                      phone: "+12125551234"
                    role:
                      id: 2
                      name: "manager"
                      permissions: ["orders.read", "orders.update", "menu.update"]
                    status: "active"
                    branches: ["US Branch", "UK Branch"]
                    created_at: "2024-01-15T10:30:00Z"
                  - id: 2
                    user_id: 12346
                    restaurant_id: 100
                    user:
                      name: "Jane Doe"
                      email: "jane@example.com"
                      phone: "+12125551235"
                    role:
                      id: 3
                      name: "staff"
                      permissions: ["orders.read", "orders.update"]
                    status: "active"
                    branches: [1]
                    created_at: "2024-01-20T14:20:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    
    post:
      tags: [Restaurant Staff]
      summary: Invite/add staff member
      description: |
        Add a new staff member to the restaurant.
        
        **Required role:** Owner only
        
        **Flow:**
        1. Invite user by email (if not registered, they receive signup link)
        2. Assign role
        3. Optionally assign to specific branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role_id
              properties:
                email:
                  type: string
                  format: email
                  description: Email of user to invite
                  example: "newstaff@example.com"
                user_id:
                  type: integer
                  description: User ID (if user already exists in system)
                  example: 12347
                role_id:
                  type: integer
                  description: Role to assign to the member
                  example: 3
                branch_ids:
                  type: array
                  items:
                    type: integer
                  description: List of branch IDs member can access (empty = all branches)
                  example: [1, 2]
                send_invitation:
                  type: boolean
                  default: true
                  description: Send email invitation to the user
                  example: true
            examples:
              inviteNewUser:
                summary: Invite new user
                value:
                  email: "newstaff@example.com"
                  role_id: 3
                  branch_ids: [1]
                  send_invitation: true
              addExistingUser:
                summary: Add existing user
                value:
                  user_id: 12347
                  email: "existing@example.com"
                  role_id: 2
                  branch_ids: [1, 2, 3]
      responses:
        '201':
          description: Staff member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/RestaurantMember'
                  invitation_sent:
                    type: boolean
                    example: true
                  invitation_url:
                    type: string
                    format: uri
                    example: "https://quickbite.com/invitations/abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Only owners can add staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "forbidden"
                  message: "Only restaurant owners can add staff members"
        '409':
          description: User already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "member_already_exists"
                  message: "User is already a member of this restaurant"

  /restaurants/{restaurantId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/MemberId'
      - $ref: '#/components/parameters/AuthorizationHeader'
    
    patch:
      tags: [Restaurant Staff]
      summary: Update staff member role/status
      description: |
        Update a staff member's role or status.
        
        **Required role:** Owner only
        
        **Note:** Cannot change owner's role or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id:
                  type: integer
                  description: New role ID
                  example: 2
                status:
                  type: string
                  enum: [active, suspended, inactive]
                  description: Member status
                  example: "active"
            examples:
              changeRole:
                summary: Change role from staff to manager
                value:
                  role_id: 2
              suspendMember:
                summary: Suspend member
                value:
                  status: "suspended"
              reactivateMember:
                summary: Reactivate suspended member
                value:
                  status: "active"
      responses:
        '200':
          description: Member updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantMember'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cannotChangeOwner:
                  value:
                    error:
                      code: "cannot_modify_owner"
                      message: "Cannot change owner's role or status"
                invalidRole:
                  value:
                    error:
                      code: "invalid_role"
                      message: "Role does not exist"
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags: [Restaurant Staff]
      summary: Remove staff member
      description: |
        Remove a staff member from the restaurant.
        
        **Required role:** Owner only
        
        **Note:** Cannot remove the owner
      responses:
        '204':
          description: Staff member removed successfully
        '400':
          description: Cannot remove owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "cannot_remove_owner"
                  message: "Cannot remove the restaurant owner"
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # BRANCH ACCESS CONTROL (per member)
  # ============================================================================
  
  /restaurants/{restaurantId}/members/{memberId}/branches:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/MemberId'
      - $ref: '#/components/parameters/AuthorizationHeader'
    
    get:
      tags: [Branch Access]
      summary: Get member's accessible branches
      description: |
        Get list of branches that a staff member can access.
        
        **Required role:** Owner or Manager
      responses:
        '200':
          description: List of accessible branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_id:
                    type: integer
                    example: 5
                  member_name:
                    type: string
                    example: "John Smith"
                  access_type:
                    type: string
                    enum: [all_branches, specific_branches]
                    description: Whether member has access to all branches or specific ones
                    example: "specific_branches"
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
              example:
                member_id: 5
                member_name: "John Smith"
                access_type: "specific_branches"
                branches:
                  - id: 1
                    restaurant_id: 100
                    name: "Downtown Branch"
                    address: "123 Main St, New York, NY"
                    is_active: true
                  - id: 2
                    restaurant_id: 100
                    name: "Uptown Branch"
                    address: "456 Broadway, New York, NY"
                    is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    
    put:
      tags: [Branch Access]
      summary: Update member's branch access
      description: |
        Replace the list of branches a staff member can access.
        
        **Required role:** Owner only
        
        **Behavior:**
        - Empty array `[]` = Access to all branches
        - Array with IDs `[1, 2, 3]` = Access only to specified branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branch_ids
              properties:
                branch_ids:
                  type: array
                  items:
                    type: integer
                  description: |
                    List of branch IDs member can access.
                    Empty array = all branches.
                  example: [1, 3]
            examples:
              specificBranches:
                summary: Grant access to specific branches
                value:
                  branch_ids: [1, 3]
              allBranches:
                summary: Grant access to all branches
                value:
                  branch_ids: []
              singleBranch:
                summary: Grant access to single branch
                value:
                  branch_ids: [2]
      responses:
        '200':
          description: Branch access updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_id:
                    type: integer
                    example: 5
                  access_type:
                    type: string
                    enum: [all_branches, specific_branches]
                    example: "specific_branches"
                  branch_ids:
                    type: array
                    items:
                      type: integer
                    example: [1, 3]
                  updated_at:
                    type: string
                    format: date-time
                    example: "2024-02-13T10:30:00Z"
        '400':
          description: Invalid branch IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "invalid_branch_ids"
                  message: "One or more branch IDs do not belong to this restaurant"
                  details:
                    invalid_ids: [5, 10]
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # ROLES & PERMISSIONS (custom roles)
  # ============================================================================
  
  /restaurants/{restaurantId}/roles:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/AuthorizationHeader'
    
    get:
      tags: [Roles & Permissions]
      summary: List restaurant roles
      description: |
        Get all roles available for this restaurant.
        
        **Includes:**
        - System default roles (owner, manager, staff)
        - Custom roles created by restaurant
        
        **Required role:** Owner or Manager
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
              example:
                data:
                  - id: 1
                    name: "owner"
                    is_system: true
                    is_custom: false
                    permissions:
                      - id: 1
                        resource: "restaurant"
                        action: "*"
                      - id: 2
                        resource: "members"
                        action: "*"
                      - id: 3
                        resource: "menu"
                        action: "*"
                      - id: 4
                        resource: "orders"
                        action: "*"
                  - id: 2
                    name: "manager"
                    is_system: true
                    is_custom: false
                    permissions:
                      - id: 5
                        resource: "menu"
                        action: "read"
                      - id: 6
                        resource: "menu"
                        action: "update"
                      - id: 7
                        resource: "orders"
                        action: "read"
                      - id: 8
                        resource: "orders"
                        action: "update"
                  - id: 3
                    name: "staff"
                    is_system: true
                    is_custom: false
                    permissions:
                      - id: 9
                        resource: "orders"
                        action: "read"
                      - id: 10
                        resource: "orders"
                        action: "update"
                  - id: 10
                    name: "kitchen_staff"
                    is_system: false
                    is_custom: true
                    permissions:
                      - id: 9
                        resource: "orders"
                        action: "read"
                      - id: 10
                        resource: "orders"
                        action: "update"
                      - id: 11
                        resource: "menu"
                        action: "read"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    
    post:
      tags: [Roles & Permissions]
      summary: Create custom role
      description: |
        Create a custom role with specific permissions.
        
        **Required role:** Owner only
        
        **Use cases:**
        - Kitchen staff (can view orders and menu, but not accept/reject)
        - Delivery coordinator (can view orders and assign delivery)
        - Inventory manager (can update menu availability)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - permission_ids
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-z_]+$'
                  description: Role name (lowercase, underscores only)
                  example: "kitchen_staff"
                description:
                  type: string
                  maxLength: 200
                  description: Role description
                  example: "Kitchen staff can view and update order status"
                permission_ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  description: List of permission IDs to assign to this role
                  example: [9, 10, 11]
            examples:
              kitchenStaff:
                summary: Kitchen staff role
                value:
                  name: "kitchen_staff"
                  description: "Can view orders and update preparation status"
                  permission_ids: [9, 10, 11]
              deliveryCoordinator:
                summary: Delivery coordinator role
                value:
                  name: "delivery_coordinator"
                  description: "Can view orders and manage delivery assignments"
                  permission_ids: [9, 10, 15, 16]
      responses:
        '201':
          description: Custom role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              example:
                id: 10
                name: "kitchen_staff"
                description: "Can view orders and update preparation status"
                is_system: false
                is_custom: true
                permissions:
                  - id: 9
                    resource: "orders"
                    action: "read"
                  - id: 10
                    resource: "orders"
                    action: "update"
                  - id: 11
                    resource: "menu"
                    action: "read"
                created_at: "2024-02-13T10:30:00Z"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicateRole:
                  value:
                    error:
                      code: "role_already_exists"
                      message: "Role with this name already exists"
                invalidPermissions:
                  value:
                    error:
                      code: "invalid_permissions"
                      message: "One or more permission IDs are invalid"
                      details:
                        invalid_ids: [99, 100]
        '403':
          $ref: '#/components/responses/Forbidden'

  /restaurants/{restaurantId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/RoleId'
      - $ref: '#/components/parameters/AuthorizationHeader'
    
    get:
      tags: [Roles & Permissions]
      summary: Get role details
      description: Get detailed information about a specific role
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          $ref: '#/components/responses/NotFound'
    
    patch:
      tags: [Roles & Permissions]
      summary: Update custom role
      description: |
        Update a custom role's name, description, or permissions.
        
        **Required role:** Owner only
        
        **Note:** Cannot update system roles (owner, manager, staff)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 50
                  example: "senior_kitchen_staff"
                description:
                  type: string
                  maxLength: 200
                  example: "Senior kitchen staff with menu update permissions"
                permission_ids:
                  type: array
                  items:
                    type: integer
                  description: Complete list of permission IDs (replaces existing)
                  example: [9, 10, 11, 12]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Cannot update system role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "cannot_modify_system_role"
                  message: "System roles cannot be modified"
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags: [Roles & Permissions]
      summary: Delete custom role
      description: |
        Delete a custom role.
        
        **Required role:** Owner only
        
        **Note:** 
        - Cannot delete system roles
        - Cannot delete role if members are assigned to it
      responses:
        '204':
          description: Role deleted successfully
        '400':
          description: Cannot delete role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                systemRole:
                  value:
                    error:
                      code: "cannot_delete_system_role"
                      message: "System roles cannot be deleted"
                roleInUse:
                  value:
                    error:
                      code: "role_in_use"
                      message: "Cannot delete role while members are assigned to it"
                      details:
                        member_count: 3
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /restaurants/{restaurantId}/permissions:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/AuthorizationHeader'
    
    get:
      tags: [Roles & Permissions]
      summary: List available permissions
      description: |
