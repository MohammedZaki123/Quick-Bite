  # ============================================================================
  # ORDERS
  # ============================================================================
  
  /orders:
    post:
      tags: [Orders]
      summary: Place order
      description: Create new order from cart with payment
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            format: uuid
          description: Idempotency key to prevent duplicate orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_address_id
                - payment_method
              properties:
                customer_address_id:
                  type: integer
                delivery_instructions:
                  type: string
                  maxLength: 500
                payment_method:
                  type: string
                  enum: [online, cod]
                payment_details:
                  type: object
                  description: Required if payment_method is 'online'
                  properties:
                    provider_id:
                      type: integer
                    payment_method_token:
                      type: string
                tip_amount:
                  type: number
                  format: decimal
                  minimum: 0
                  example: 3.00
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request (cart empty, payment failed, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      tags: [Orders]
      summary: List customer orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, preparing, ready_for_pickup, picked_up, out_for_delivery, delivered, cancelled, rejected]
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'

  /orders/{order_id}:
    parameters:
